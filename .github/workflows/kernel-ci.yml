# Reusable workflow: build a FreeBSD kernel on the spot and test it.
# See example/reusable-workflow.yml for how to call it.
name: kernel-ci

on:
  workflow_call:
    inputs:
      src-repo:
        description: Git URL of the FreeBSD source tree
        type: string
        required: true
      src-branch:
        description: Branch, tag or commit to build
        type: string
        default: ''
      release:
        description: Base image override, e.g. 14.4 or 15.1-STABLE. Default is detected from the source tree.
        type: string
        default: ''
      kernconf:
        type: string
        default: GENERIC
      world:
        description: Build and install the whole world too (slow). Default false uses the latest official prebuilt world of the branch
        type: boolean
        default: false
      run:
        description: Script to run in the VM on the new kernel
        type: string
        default: uname -a
      timeout-minutes:
        type: number
        default: 360

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: imrcpan/freebsd-kernel-ci-tester@main
        with:
          src-repo: ${{ inputs.src-repo }}
          src-branch: ${{ inputs.src-branch }}
          release: ${{ inputs.release }}
          kernconf: ${{ inputs.kernconf }}
          skip-world: ${{ !inputs.world }}
          run: ${{ inputs.run }}
