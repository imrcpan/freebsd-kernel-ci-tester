# Copy to .github/workflows/ in your repository.
# Builds only the kernel of a FreeBSD source tree on the spot, boots it and
# tests it. The world is not built: skip-world (default true) boots the latest
# official prebuilt snapshot of the branch the source tree is on, detected from
# sys/conf/newvers.sh, so a fork's "dev" branch based on main gets 16.0-CURRENT.
# Much faster than a full world build (tens of minutes with KVM).
name: freebsd-kernel

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: imrcpan/freebsd-kernel-ci-tester@main
        with:
          # Source tree to build: this can be any fork/branch.
          # To test the repository that runs this CI, use
          #   src-repo: ${{ github.server_url }}/${{ github.repository }}.git
          #   src-branch: ${{ github.sha }}
          src-repo: https://github.com/freebsd/freebsd-src.git
          src-branch: main
          kernconf: GENERIC
          skip-world: 'true'
          reboot: 'true'
          # Runs on the freshly built kernel.
          run: |
            uname -a
            sysctl kern.version
            kldload -n tmpfs || true
            echo "kernel works"
