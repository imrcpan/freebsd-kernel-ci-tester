# Copy this file to .github/workflows/full-test-demo.yml and the directory
# example/full-test-demo/tests/ to the same path in your repository.
#
# 1. job "build": build the whole world and kernel from source, install them,
#    reboot into them, then export the installed VM disk as an artifact.
# 2. jobs "test-sanity", "test-kernel", "test-userland": run in parallel, each
#    boots that exact system and runs one test script. No cache is involved: the
#    system is handed over as a short-lived artifact (1 day) and used only by
#    this workflow run.
name: full-test-demo

on:
  workflow_dispatch:
    inputs:
      src-repo:
        description: FreeBSD source tree
        default: https://github.com/freebsd/freebsd-src.git
      src-branch:
        description: Branch, tag or commit
        default: main

env:
  SRC_REPO: ${{ inputs.src-repo || 'https://github.com/freebsd/freebsd-src.git' }}
  SRC_BRANCH: ${{ inputs.src-branch || 'main' }}
  BUNDLE: ${{ github.workspace }}/freebsd-built.tar.zst

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Full world and kernel build, install, reboot
        uses: imrcpan/freebsd-kernel-ci-tester@main
        with:
          src-repo: ${{ env.SRC_REPO }}
          src-branch: ${{ env.SRC_BRANCH }}
          kernconf: GENERIC
          # defaults: make buildworld buildkernel; installkernel installworld;
          # etcupdate; reboot into the new system.
          build-timeout: '19800'
          # Runs on the new system, before the image is exported.
          run: |
            echo "$SRC_REPO $SRC_BRANCH $(git rev-parse HEAD)" > /etc/built-from
            cat /etc/built-from
          envs: SRC_REPO SRC_BRANCH
          export-image: ${{ env.BUNDLE }}

      - name: Hand the built system to the test jobs
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-built
          path: ${{ env.BUNDLE }}
          retention-days: 1
          compression-level: 0

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        test: [01-sanity, 02-kernel, 03-userland]
    name: test-${{ matrix.test }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: freebsd-built
          path: ${{ runner.temp }}/built

      - name: Boot the built system and run ${{ matrix.test }}
        uses: imrcpan/freebsd-kernel-ci-tester@main
        with:
          image: ${{ runner.temp }}/built/freebsd-built.tar.zst
          run-file: example/full-test-demo/tests/${{ matrix.test }}.sh
          mem: '4096'
