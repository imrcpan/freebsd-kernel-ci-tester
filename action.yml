name: 'FreeBSD source build and test'
description: 'Boot an official FreeBSD VM (QEMU) on the runner, build a FreeBSD source tree from git inside it, install it and run a command on the result'
author: 'imrcpan'

inputs:
  src-repo:
    description: 'Git URL of the FreeBSD source tree to build, e.g. https://github.com/freebsd/freebsd-src.git. Leave empty to build nothing and only boot (see image) and run.'
    required: false
    default: ''
  src-branch:
    description: 'Branch, tag or commit of src-repo to build. Default is the remote HEAD.'
    required: false
    default: ''
  skip-world:
    description: 'Do not build the world: boot the latest official prebuilt snapshot of the source tree branch (16.0-CURRENT for main, 14.5-STABLE for stable/14, ...) and build and install only the kernel on top of it. Set to false to build and install the world as well.'
    required: false
    default: 'true'
  release:
    description: 'Official FreeBSD amd64 image used as the build host VM: a release such as 14.4, or a snapshot branch such as 16.0-CURRENT or 15.1-STABLE. Default: detected from the source tree when skip-world is true, otherwise 14.4.'
    required: false
    default: ''
  kernconf:
    description: 'Kernel configuration to build and install.'
    required: false
    default: 'GENERIC'
  build-cmd:
    description: 'Build command, run in the source tree. Default: make -j<cpus> buildkernel KERNCONF=<kernconf>, with buildworld in front when skip-world is false.'
    required: false
    default: ''
  install-cmd:
    description: 'Install command, run in the source tree. Default: make installkernel, plus installworld and etcupdate when skip-world is false. Set to "none" to skip installing.'
    required: false
    default: ''
  reboot:
    description: 'Reboot the VM after install-cmd so the run step uses the new kernel.'
    required: false
    default: 'true'
  run:
    description: 'Script run in the VM (with sh, in the source tree) after build and install: the program under test.'
    required: false
    default: ''
  sync-dir:
    description: 'Directory on the runner copied one way into the VM before run (tar over ssh); run and run-file start in it. Example: ${{ github.workspace }}'
    required: false
    default: ''
  sync-dest:
    description: 'Where sync-dir lands in the VM.'
    required: false
    default: '/root/work'
  run-file:
    description: 'Path (on the runner) of a script copied into the VM and run before run. Runs in the source tree if there is one.'
    required: false
    default: ''
  image:
    description: 'Path of an image bundle made by export-image in an earlier job. It is booted instead of the stock release image.'
    required: false
    default: ''
  export-image:
    description: 'Path to write an image bundle (.tar.zst) of the VM after build/install/run, to hand to later jobs. The VM is powered off afterwards.'
    required: false
    default: ''
  envs:
    description: 'Whitespace separated names of environment variables to pass into the VM.'
    required: false
    default: ''
  mem:
    description: 'VM memory in MB.'
    required: false
    default: '10240'
  cpu:
    description: 'VM cpu count. Default is the number of cpus of the runner.'
    required: false
    default: ''
  disk:
    description: 'VM disk size (sparse), e.g. 60G.'
    required: false
    default: '60G'
  verbose-build:
    description: 'Stream the whole build output into the step log. Off by default: a world build prints so much that the Actions log viewer truncates the step. The full output is always uploaded as a build-log artifact.'
    required: false
    default: 'false'
  build-timeout:
    description: 'Seconds allowed for fetching and building the source tree.'
    required: false
    default: '18000'

runs:
  using: 'composite'
  steps:
    - name: Install host tools
      shell: bash
      run: '"${{ github.action_path }}/scripts/setup-host.sh"'

    - name: Boot FreeBSD VM
      shell: bash
      env:
        FBSD_RELEASE: ${{ inputs.release }}
        SKIP_WORLD: ${{ inputs.skip-world }}
        SRC_REPO: ${{ inputs.src-repo }}
        SRC_BRANCH: ${{ inputs.src-branch }}
        FBSD_MEM: ${{ inputs.mem }}
        FBSD_CPU: ${{ inputs.cpu }}
        FBSD_DISK: ${{ inputs.disk }}
        FBSD_IMAGE: ${{ inputs.image }}
      run: '"${{ github.action_path }}/scripts/boot-vm.sh"'

    - name: Build and run the FreeBSD source tree
      shell: bash
      env:
        SRC_REPO: ${{ inputs.src-repo }}
        SRC_BRANCH: ${{ inputs.src-branch }}
        KERNCONF: ${{ inputs.kernconf }}
        SKIP_WORLD: ${{ inputs.skip-world }}
        BUILD_CMD: ${{ inputs.build-cmd }}
        INSTALL_CMD_INPUT: ${{ inputs.install-cmd }}
        REBOOT: ${{ inputs.reboot }}
        RUN_CMD: ${{ inputs.run }}
        RUN_FILE: ${{ inputs.run-file }}
        SYNC_DIR: ${{ inputs.sync-dir }}
        SYNC_DEST: ${{ inputs.sync-dest }}
        PASS_ENVS: ${{ inputs.envs }}
        BUILD_TIMEOUT: ${{ inputs.build-timeout }}
        BUILD_VERBOSE: ${{ inputs.verbose-build }}
      run: '"${{ github.action_path }}/scripts/run.sh"'

    - name: Export VM image
      if: inputs.export-image != ''
      shell: bash
      env:
        EXPORT_IMAGE: ${{ inputs.export-image }}
      run: '"${{ github.action_path }}/scripts/export-image.sh" "$EXPORT_IMAGE"'

    - name: Upload the full build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: freebsd-build-log-${{ github.job }}
        path: ${{ runner.temp }}/freebsd-vm/build.log
        retention-days: 3
        if-no-files-found: ignore

    - name: Show VM console on failure
      if: failure()
      shell: bash
      run: '"${{ github.action_path }}/scripts/cleanup.sh" --dump'

    - name: Stop FreeBSD VM
      if: always()
      shell: bash
      run: '"${{ github.action_path }}/scripts/cleanup.sh"'
