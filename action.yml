name: 'FreeBSD source build and test'
description: 'Boot an official FreeBSD VM (QEMU) on the runner, build a FreeBSD source tree from git inside it, install it and run a command on the result'
author: 'imrcpan'

inputs:
  src-repo:
    description: 'Git URL of the FreeBSD source tree to build, e.g. https://github.com/freebsd/freebsd-src.git'
    required: true
  src-branch:
    description: 'Branch, tag or commit of src-repo to build. Default is the remote HEAD.'
    required: false
    default: ''
  release:
    description: 'Official FreeBSD amd64 release used as the build host VM, e.g. 14.4. It must be able to build the source tree.'
    required: false
    default: '14.4'
  kernconf:
    description: 'Kernel configuration to build and install.'
    required: false
    default: 'GENERIC'
  build-cmd:
    description: 'Build command, run in the source tree. Default: make -j<cpus> buildworld buildkernel KERNCONF=<kernconf>'
    required: false
    default: ''
  install-cmd:
    description: 'Install command, run in the source tree. Set to "none" to skip installing.'
    required: false
    default: 'make installkernel installworld KERNCONF=${KERNCONF} && etcupdate -B || true'
  reboot:
    description: 'Reboot the VM after install-cmd so the run step uses the new kernel.'
    required: false
    default: 'true'
  run:
    description: 'Script run in the VM (with sh, in the source tree) after build and install: the program under test.'
    required: false
    default: ''
  envs:
    description: 'Whitespace separated names of environment variables to pass into the VM.'
    required: false
    default: ''
  mem:
    description: 'VM memory in MB.'
    required: false
    default: '10240'
  cpu:
    description: 'VM cpu count. Default is the number of cpus of the runner.'
    required: false
    default: ''
  disk:
    description: 'VM disk size (sparse), e.g. 60G.'
    required: false
    default: '60G'
  build-timeout:
    description: 'Seconds allowed for fetching and building the source tree.'
    required: false
    default: '18000'

runs:
  using: 'composite'
  steps:
    - name: Install host tools
      shell: bash
      run: '"${{ github.action_path }}/scripts/setup-host.sh"'

    - name: Boot FreeBSD VM
      shell: bash
      env:
        FBSD_RELEASE: ${{ inputs.release }}
        FBSD_MEM: ${{ inputs.mem }}
        FBSD_CPU: ${{ inputs.cpu }}
        FBSD_DISK: ${{ inputs.disk }}
      run: '"${{ github.action_path }}/scripts/boot-vm.sh"'

    - name: Build and run the FreeBSD source tree
      shell: bash
      env:
        SRC_REPO: ${{ inputs.src-repo }}
        SRC_BRANCH: ${{ inputs.src-branch }}
        KERNCONF: ${{ inputs.kernconf }}
        BUILD_CMD: ${{ inputs.build-cmd }}
        INSTALL_CMD_INPUT: ${{ inputs.install-cmd }}
        REBOOT: ${{ inputs.reboot }}
        RUN_CMD: ${{ inputs.run }}
        PASS_ENVS: ${{ inputs.envs }}
        BUILD_TIMEOUT: ${{ inputs.build-timeout }}
      run: '"${{ github.action_path }}/scripts/run.sh"'

    - name: Show VM console on failure
      if: failure()
      shell: bash
      run: '"${{ github.action_path }}/scripts/cleanup.sh" --dump'

    - name: Stop FreeBSD VM
      if: always()
      shell: bash
      run: '"${{ github.action_path }}/scripts/cleanup.sh"'
